name: Supabase keep-alive

# Free Supabase projects pause after ~7 days without database activity.
# This runs a tiny read query every 3 days so the project stays awake.
# Uses the same public (anon) key the app already ships in src/js/00-config.js.

on:
  schedule:
    - cron: '17 15 */3 * *'   # every 3 days at 15:17 UTC
  workflow_dispatch: {}        # "Run workflow" button for a manual ping

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: src/js/00-config.js
          sparse-checkout-cone-mode: false
      - name: Query the database
        run: |
          URL=$(grep -oE "https://[a-z0-9]+\.supabase\.co" src/js/00-config.js | head -1)
          KEY=$(grep -oE "SUPABASE_ANON_KEY *= *'[^']+'" src/js/00-config.js | sed -E "s/.*'([^']+)'/\1/")
          test -n "$URL" -a -n "$KEY" || { echo "Supabase URL/key not found in config"; exit 1; }
          CODE=$(curl -s -o /tmp/out -w '%{http_code}' --retry 3 --retry-delay 20 \
            "$URL/rest/v1/users?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            cat /tmp/out
            echo "::error::Supabase did not respond normally (HTTP $CODE). The project may be paused: restore it in the Supabase dashboard."
            exit 1
          fi

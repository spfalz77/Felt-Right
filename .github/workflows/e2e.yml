name: E2E (multi-player)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      hands:
        description: Hands to play
        default: '3'
      filter:
        description: Only run tests whose name matches (blank = all)
        default: ''

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (applies supabase/migrations)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,storage-api,postgres-meta

      - name: Install test dependencies
        run: |
          npm ci
          npx playwright install --with-deps webkit

      - name: Build app
        run: npm run build

      - name: Run multi-player tests
        env:
          FILTER: ${{ github.event.inputs.filter }}
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          E2E_HANDS="${{ github.event.inputs.hands || '3' }}" npm run test:e2e -- ${FILTER:+-g "$FILTER"}

      - name: Upload report, videos and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

name: E2E (multi-player)

on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      hands:
        description: Hands to play
        default: '3'
      filter:
        description: Only run tests whose name matches (blank = all)
        default: ''
      repeat:
        description: Run each test this many times (flakiness check)
        default: '1'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The `table` Edge Function over HTTP: real signed-in users, no browser
  server:
    name: server rules (Edge Function)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase (applies supabase/migrations)
        run: |
          EXCLUDE=studio,imgproxy,logflare,vector,supavisor,storage-api,postgres-meta
          supabase start -x "$EXCLUDE" || { supabase stop --no-backup || true; sleep 10; supabase start -x "$EXCLUDE"; }
      - name: Serve the table function with test hooks on
        run: |
          printf "ALLOW_TEST_HOOKS=1\nTABLE_TICK_SECRET=ci-tick-secret-0123456789abcdef0123456789\n" > /tmp/functions.env
          nohup supabase functions serve --env-file /tmp/functions.env > /tmp/functions.log 2>&1 &
          sleep 8
      - name: Run server integration tests
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          node --test tests/server/*.test.mjs
      - name: Function logs
        if: always()
        run: tail -n 150 /tmp/functions.log || true

  # The same phone tests with games run by the `table` Edge Function
  # (SERVER_RULES on). Grows phase by phase until it covers the whole suite.
  e2e-server-rules:
    name: e2e on server rules
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase (applies supabase/migrations)
        run: |
          EXCLUDE=studio,imgproxy,logflare,vector,supavisor,storage-api,postgres-meta
          supabase start -x "$EXCLUDE" || { supabase stop --no-backup || true; sleep 10; supabase start -x "$EXCLUDE"; }
      - name: Serve the table function with test hooks on
        run: |
          printf "ALLOW_TEST_HOOKS=1\nTABLE_TICK_SECRET=ci-tick-secret-0123456789abcdef0123456789\n" > /tmp/functions.env
          nohup supabase functions serve --env-file /tmp/functions.env > /tmp/functions.log 2>&1 &
      - name: Install test dependencies
        run: npm ci
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install WebKit
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps webkit
          else
            npx playwright install --with-deps webkit
          fi
      - name: Build app
        run: npm run build
      - name: Run phone tests on server rules
        env:
          REPEAT: ${{ github.event.inputs.repeat || '1' }}
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          E2E_SERVER_RULES=1 npx playwright test home-game side-pots tournament.spec quit rebuys variants chop dealer-choice break-addon turn-timer disconnect-rejoin --repeat-each "${REPEAT:-1}"
      - name: Function logs
        if: always()
        run: tail -n 200 /tmp/functions.log || true
      - name: Upload report, videos and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-rules-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e:
    # Three machines in parallel, each with its own local Supabase, each running
    # a third of the tests (about 4 minutes instead of 11)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: e2e (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (applies supabase/migrations)
        # GitHub's runners sometimes have a port still held; stop cleanly and retry once
        run: |
          EXCLUDE=studio,imgproxy,edge-runtime,logflare,vector,supavisor,storage-api,postgres-meta
          supabase start -x "$EXCLUDE" || { supabase stop --no-backup || true; sleep 10; supabase start -x "$EXCLUDE"; }

      - name: Install test dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install WebKit
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps webkit
          else
            npx playwright install --with-deps webkit
          fi

      - name: Build app
        run: npm run build

      - name: Run multi-player tests
        env:
          FILTER: ${{ github.event.inputs.filter }}
          REPEAT: ${{ github.event.inputs.repeat || '1' }}
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          E2E_HANDS="${{ github.event.inputs.hands || '3' }}" npm run test:e2e -- ${FILTER:+-g "$FILTER"} --repeat-each "${REPEAT:-1}" --shard ${{ matrix.shard }}/3 --pass-with-no-tests

      - name: Upload report, videos and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

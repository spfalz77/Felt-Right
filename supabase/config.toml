# Local Supabase settings, used only by `supabase start` for the end-to-end tests.
# Ports are in the 553xx range: 543xx is sometimes taken on GitHub's runners.
# The live project is configured in the Supabase dashboard, not here.
project_id = "felt-right"

[api]
port = 55321
schemas = ["public", "graphql_public"]

[db]
port = 55322
shadow_port = 55320
major_version = 17

[realtime]
enabled = true

[studio]
enabled = false
port = 55323

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
port = 55327

[auth]
enabled = true
site_url = "http://felt-right.test/Felt-Right/"
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# Test email inbox: not needed (email confirmation is off)
[local_smtp]
enabled = false

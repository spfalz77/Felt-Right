# Local Supabase settings, used only by `supabase start` for the end-to-end tests.
# Ports are in the 553xx range: 543xx is sometimes taken on GitHub's runners.
# The live project is configured in the Supabase dashboard, not here.
project_id = "felt-right"

[api]
port = 55321
schemas = ["public", "graphql_public"]

[db]
port = 55322
shadow_port = 55320
major_version = 17

[realtime]
enabled = true

[studio]
enabled = false
port = 55323

[storage]
enabled = false

[edge_runtime]
enabled = true

[functions.table]
verify_jwt = true

[analytics]
enabled = false
port = 55327

[auth]
enabled = true
site_url = "http://felt-right.test/Felt-Right/"
enable_signup = true
# Guests (getting-in plan, phase 1)
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
enable_confirmations = false
otp_length = 6
otp_expiry = 3600

# Sign-in codes: the emails carry the 6-digit code ({{ .Token }}). The same
# templates are what the live project needs (Authentication → Email Templates).
[auth.email.template.magic_link]
subject = "Your Felt Right code"
content_path = "./supabase/templates/code.html"

[auth.email.template.confirmation]
subject = "Your Felt Right code"
content_path = "./supabase/templates/code.html"

[auth.email.template.email_change]
subject = "Your Felt Right code"
content_path = "./supabase/templates/code.html"

[auth.rate_limit]
email_sent = 1000

# Test email inbox (Mailpit), for the sign-in-by-code tests
[local_smtp]
enabled = true
port = 55324

[functions.account]
verify_jwt = true
